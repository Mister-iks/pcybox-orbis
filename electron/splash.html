<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0f172a;
      border-radius: 12px;
      border: 1px solid #1e3a5f;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    .logo {
      width: 56px; height: 56px;
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 20px;
      box-shadow: 0 0 32px rgba(59,130,246,0.4);
    }
    .logo svg { width: 32px; height: 32px; }

    h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 6px; }
    .sub { font-size: 13px; color: #64748b; margin-bottom: 36px; }

    .bar-wrap {
      width: 200px; height: 4px;
      background: #1e293b;
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 14px;
    }
    .bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(to right, #3b82f6, #6366f1);
      border-radius: 2px;
      animation: fill 4s ease-out forwards;
    }
    @keyframes fill {
      0%   { width: 0% }
      60%  { width: 75% }
      85%  { width: 88% }
      100% { width: 95% }
    }

    .status { font-size: 11px; color: #475569; }
  </style>
</head>
<body>
  <div class="logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round">
      <path d="M12 2L2 7l10 5 10-5-10-5z"/>
      <path d="M2 17l10 5 10-5"/>
      <path d="M2 12l10 5 10-5"/>
    </svg>
  </div>
  <h1>NetGraph</h1>
  <p class="sub">Live Network Monitor</p>
  <div class="bar-wrap"><div class="bar"></div></div>
  <p class="status">Démarrage du moteur de capture…</p>
</body>
</html>
