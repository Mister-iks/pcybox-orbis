version: '3.9'

services:
  backend:
    build: ./backend
    network_mode: host
    privileged: true        # required for packet capture
    volumes:
      - ./data:/app/data    # GeoIP database
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
