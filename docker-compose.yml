services:
  orbis:
    build: .
    # Host networking  Scapy captures traffic on the real host interfaces.
    # Linux only. Docker Desktop (Mac/Windows) uses a VM and won't capture host traffic.
    network_mode: host
    cap_add:
      - NET_ADMIN   # promiscuous mode
      - NET_RAW     # raw socket / packet capture
    environment:
      - ORBIS_BIND=0.0.0.0
    volumes:
      # data/GeoLite2-City.mmdb   optional, for offline geolocation
      # data/netgraph.db          created automatically at runtime
      - ./data:/app/data
    restart: unless-stopped
